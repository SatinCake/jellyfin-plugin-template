overview: "TV-like broadcast channel from your libraries with optional ad breaks, IPTV playlist and XMLTV guide."
description: >
  Broadcast generates a continuous, TV-style channel from your existing Jellyfin libraries. It builds a configurable
  schedule (duration and alignment), inserts optional commercials from a folder, and exposes an IPTV playlist (M3U)
  and XMLTV EPG for Jellyfin Live TV integration. The plugin also includes a rich configuration page with
  schedule previews and diagnostics.
