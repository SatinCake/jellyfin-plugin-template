name: Build and Release

on:
  pull_request:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8.x
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Jellyfin.Plugin.Broadcast/Jellyfin.Plugin.Broadcast.csproj --nologo

      - name: Build (Release)
        run: dotnet build Jellyfin.Plugin.Broadcast/Jellyfin.Plugin.Broadcast.csproj -c Release --nologo --no-restore

      - name: Upload build artifacts (DLL + PDB)
        uses: actions/upload-artifact@v4
        with:
          name: plugin-artifacts
          path: |
            Jellyfin.Plugin.Broadcast/bin/Release/net8.0/Jellyfin.Plugin.Broadcast.dll
            Jellyfin.Plugin.Broadcast/bin/Release/net8.0/Jellyfin.Plugin.Broadcast.pdb

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build
    env:
      REPO: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8.x
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Get version from tag
        id: get_version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build (Release)
        run: dotnet build Jellyfin.Plugin.Broadcast/Jellyfin.Plugin.Broadcast.csproj -c Release --nologo

      - name: Prepare dist folder
        run: |
          mkdir -p dist
          cp Jellyfin.Plugin.Broadcast/bin/Release/net8.0/Jellyfin.Plugin.Broadcast.dll dist/
          if [ -f Jellyfin.Plugin.Broadcast/bin/Release/net8.0/Jellyfin.Plugin.Broadcast.pdb ]; then cp Jellyfin.Plugin.Broadcast/bin/Release/net8.0/Jellyfin.Plugin.Broadcast.pdb dist/; fi
          if [ -f LICENSE ]; then cp LICENSE dist/; fi

      - name: Create zip package
        run: |
          cd dist
          zip -9 -j Jellyfin.Plugin.Broadcast-${{ steps.get_version.outputs.version }}.zip Jellyfin.Plugin.Broadcast.dll Jellyfin.Plugin.Broadcast.pdb LICENSE 2>/dev/null || zip -9 -j Jellyfin.Plugin.Broadcast-${{ steps.get_version.outputs.version }}.zip Jellyfin.Plugin.Broadcast.dll LICENSE 2>/dev/null || zip -9 -j Jellyfin.Plugin.Broadcast-${{ steps.get_version.outputs.version }}.zip Jellyfin.Plugin.Broadcast.dll
          # Compute both SHA256 and MD5 (manifest will use MD5)
          sha256sum Jellyfin.Plugin.Broadcast-${{ steps.get_version.outputs.version }}.zip | awk '{print $1}' > sha256.txt
          md5sum Jellyfin.Plugin.Broadcast-${{ steps.get_version.outputs.version }}.zip | awk '{print $1}' > md5.txt

      - name: Switch to default branch for manifest update
        run: |
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          git fetch origin "$DEFAULT_BRANCH"
          git checkout "$DEFAULT_BRANCH"
          git pull --ff-only origin "$DEFAULT_BRANCH"

      - name: Derive targetAbi from build.yaml
        id: abi
        shell: bash
        run: |
          TARGET_ABI=$(grep -E '^targetAbi:' build.yaml | sed -E 's/.*"([^"]+)".*/\1/') || true
          if [ -z "$TARGET_ABI" ]; then TARGET_ABI="10.9.0.0"; fi
          echo "TARGET_ABI=${TARGET_ABI}" >> $GITHUB_ENV

      - name: Update manifest.json (array layout)
        uses: actions/github-script@v7
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        with:
          script: |
            const fs = require('fs');
            const path = 'manifest.json';
            const version = process.env.VERSION;
            const checksumMd5 = fs.readFileSync('dist/md5.txt','utf8').trim();
            const targetAbi = process.env.TARGET_ABI;
            const ownerRepo = process.env.GITHUB_REPOSITORY || process.env.REPO;
            const sourceUrl = `https://github.com/${ownerRepo}/releases/download/v${version}/Jellyfin.Plugin.Broadcast-${version}.zip`;
            const timestamp = new Date().toISOString();
            const text = fs.readFileSync(path, 'utf8');
            const manifest = JSON.parse(text);
            if (!Array.isArray(manifest) || !manifest.length) {
              core.setFailed('manifest.json must be an array with at least one plugin object.');
              return;
            }
            const plugin = manifest[0];
            plugin.versions = plugin.versions || [];
            const entry = {
              version,
              changelog: 'See GitHub release notes for details.',
              targetAbi,
              sourceUrl,
              checksum: checksumMd5,
              timestamp
            };
            const sanitize = v => ({
              version: v.version,
              changelog: v.changelog,
              targetAbi: v.targetAbi,
              sourceUrl: v.sourceUrl,
              checksum: v.checksum,
              timestamp: v.timestamp
            });
            const filtered = plugin.versions.filter(v => v.version !== version).map(sanitize);
            plugin.versions = [entry, ...filtered];
            const out = JSON.stringify(manifest, null, 2) + '\n';
            fs.writeFileSync(path, out);
            // Also write a copy to dist for convenience upload
            fs.writeFileSync('dist/manifest.json', out);

      - name: Commit manifest.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update manifest for release v${{ steps.get_version.outputs.version }}"
          file_pattern: manifest.json
          branch: ${{ github.event.repository.default_branch }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Jellyfin.Plugin.Broadcast-${{ steps.get_version.outputs.version }}.zip
            Jellyfin.Plugin.Broadcast/bin/Release/net8.0/Jellyfin.Plugin.Broadcast.dll
            Jellyfin.Plugin.Broadcast/bin/Release/net8.0/Jellyfin.Plugin.Broadcast.pdb
            dist/manifest.json
          body: |
            ---
            Manifest links (copy/paste):
            Tag-specific (recommended): https://raw.githubusercontent.com/${{ github.repository }}/v${{ steps.get_version.outputs.version }}/manifest.json
            Stable (always latest):     https://raw.githubusercontent.com/${{ github.repository }}/${{ github.event.repository.default_branch }}/manifest.json
            ---
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
