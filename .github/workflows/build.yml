name: Build and Release

on:
  pull_request:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8.x
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Jellyfin.Plugin.Broadcast/Jellyfin.Plugin.Broadcast.csproj --nologo

      - name: Build (Release)
        run: dotnet build Jellyfin.Plugin.Broadcast/Jellyfin.Plugin.Broadcast.csproj -c Release --nologo --no-restore

      - name: Upload build artifacts (DLL + PDB)
        uses: actions/upload-artifact@v4
        with:
          name: plugin-artifacts
          path: |
            Jellyfin.Plugin.Broadcast/bin/Release/net8.0/Jellyfin.Plugin.Broadcast.dll
            Jellyfin.Plugin.Broadcast/bin/Release/net8.0/Jellyfin.Plugin.Broadcast.pdb

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8.x
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Get version from tag
        id: get_version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build (Release)
        run: dotnet build Jellyfin.Plugin.Broadcast/Jellyfin.Plugin.Broadcast.csproj -c Release --nologo

      - name: Prepare dist folder
        run: |
          mkdir -p dist
          cp Jellyfin.Plugin.Broadcast/bin/Release/net8.0/Jellyfin.Plugin.Broadcast.dll dist/
          if [ -f Jellyfin.Plugin.Broadcast/bin/Release/net8.0/Jellyfin.Plugin.Broadcast.pdb ]; then cp Jellyfin.Plugin.Broadcast/bin/Release/net8.0/Jellyfin.Plugin.Broadcast.pdb dist/; fi
          if [ -f LICENSE ]; then cp LICENSE dist/; fi

      - name: Create zip package
        run: |
          cd dist
          zip -9 -j Jellyfin.Plugin.Broadcast-${{ steps.get_version.outputs.version }}.zip Jellyfin.Plugin.Broadcast.dll Jellyfin.Plugin.Broadcast.pdb LICENSE 2>/dev/null || zip -9 -j Jellyfin.Plugin.Broadcast-${{ steps.get_version.outputs.version }}.zip Jellyfin.Plugin.Broadcast.dll LICENSE 2>/dev/null || zip -9 -j Jellyfin.Plugin.Broadcast-${{ steps.get_version.outputs.version }}.zip Jellyfin.Plugin.Broadcast.dll
          sha256sum Jellyfin.Plugin.Broadcast-${{ steps.get_version.outputs.version }}.zip | awk '{print $1}' > sha256.txt

      - name: Generate plugin manifest (manifest.json)
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          CHECKSUM=$(cat dist/sha256.txt)
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          cat > dist/manifest.json << JSON
          {
            "name": "Broadcast",
            "guid": "eb5d7894-8eef-4b36-aa6f-5d124e828ce1",
            "overview": "TV-like broadcast channel from your libraries with optional ad breaks, IPTV playlist and XMLTV guide.",
            "description": "Broadcast generates a continuous, TV-style channel from your Jellyfin libraries with optional commercials. Includes IPTV playlist (M3U) and XMLTV EPG endpoints.",
            "category": "Live TV",
            "owner": "satincake",
            "versions": [
              {
                "version": "${VERSION}",
                "changelog": "See GitHub release notes for details.",
                "targetAbi": "10.9.0.0",
                "sourceUrl": "https://github.com/${{ github.repository }}",
                "checksum": "sha256:${CHECKSUM}",
                "timestamp": "${TS}",
                "artifacts": [
                  {
                    "name": "Jellyfin.Plugin.Broadcast.zip",
                    "url": "https://github.com/${{ github.repository }}/releases/download/v${VERSION}/Jellyfin.Plugin.Broadcast-${VERSION}.zip"
                  }
                ]
              }
            ]
          }
          JSON

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Jellyfin.Plugin.Broadcast-${{ steps.get_version.outputs.version }}.zip
            Jellyfin.Plugin.Broadcast/bin/Release/net8.0/Jellyfin.Plugin.Broadcast.dll
            Jellyfin.Plugin.Broadcast/bin/Release/net8.0/Jellyfin.Plugin.Broadcast.pdb
            dist/manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
