name: '🚀 Publish Plugin'

on:
  release:
    types: [published, prereleased]
  workflow_dispatch:

jobs:
  call:
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/publish.yaml@master
    with:
      version: ${{ github.event.release.tag_name }}
      is-unstable: ${{ github.event.release.prerelease }}
    secrets:
      deploy-host: ${{ secrets.DEPLOY_HOST }}
      deploy-user: ${{ secrets.DEPLOY_USER }}
      deploy-key: ${{ secrets.DEPLOY_KEY }}

  annotate-release:
    if: github.event_name == 'release'
    needs: call
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Append manifest links to release body
        uses: actions/github-script@v7
        with:
          script: |
            const release = context.payload.release;
            if (!release) { core.info('No release payload found; skipping.'); return; }
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = release.tag_name;
            const defaultBranch = context.payload.repository?.default_branch || 'main';
            const base = `https://raw.githubusercontent.com/${owner}/${repo}`;
            const stableUrl = `${base}/${defaultBranch}/manifest.json`;
            const tagUrl = `${base}/${tag}/manifest.json`;
            const markerTitle = 'Manifest links (copy into Jellyfin):';
            if ((release.body || '').includes(markerTitle)) { core.info('Manifest links already present; skipping update.'); return; }
            const block = [
              '', '---', markerTitle, '',
              'Recommended (immutable for this version):', tagUrl, '',
              'Stable (always latest on default branch):', stableUrl, '',
              'Usage: Jellyfin admin -> Plugins -> Repositories -> Add -> paste one URL above.', '---', ''
            ].join('\n');
            const newBody = (release.body || '') + block;
            await github.rest.repos.updateRelease({ owner, repo, release_id: release.id, body: newBody });
            core.info('Updated release description with manifest links.');
